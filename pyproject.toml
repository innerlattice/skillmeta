[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "skillmeta"
version = "0.1.0"
description = "Portable skill.json manifests for Agent Skills"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Aya Hohner" }
]
dependencies = [
  "jsonschema>=4.23,<5",
  "PyYAML>=6,<7"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only"
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<9",
  "ruff>=0.9,<1"
]

[project.scripts]
skillmeta = "skillmeta.cli:main"

[project.urls]
Repository = "https://github.com/innerlattice/skillmeta"
Specification = "https://github.com/innerlattice/skillmeta/blob/main/SPECIFICATION.md"

[tool.hatch.build.targets.wheel]
packages = ["src/skillmeta"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
